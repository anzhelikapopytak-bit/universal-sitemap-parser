name: Universal Sitemap Engine

run-name: "Universal sitemap run • ${{ inputs.run_id }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID generated by the Google Sheet"
        required: true
        type: string
      payload_gzip_b64:
        description: "GZIP + Base64URL JSON payload generated by Apps Script"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "universal-sitemap-${{ inputs.run_id }}"
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run universal sitemap engine
        env:
          PARSER_RUN_ID: ${{ inputs.run_id }}
          PARSER_PAYLOAD_GZIP_B64: ${{ inputs.payload_gzip_b64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python universal_sitemap_parser.py
