name: Universal Analysis Engine

run-name: "Universal analysis • ${{ inputs.run_id }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Analysis Run ID generated by the Control spreadsheet"
        required: true
        type: string
      payload_gzip_b64:
        description: "GZIP + Base64URL JSON payload generated by Apps Script"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "universal-analysis-${{ inputs.run_id }}"
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run universal analysis engine
        env:
          PARSER_RUN_ID: ${{ inputs.run_id }}
          PARSER_PAYLOAD_GZIP_B64: ${{ inputs.payload_gzip_b64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python universal_analysis_engine.py
